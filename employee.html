
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Employee - DHL Courier Service</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>DHL Courier Service</h1>
    <p>Courier Service Management System</p>
</header>

<div class="container">
    <aside class="sidebar">
        <h2>Menu</h2>
        <a href="index.html">Home</a>
        <a href="insert.html">Insert</a>
        <a href="view.html">View</a>
        <a href="search.html">Search</a>
        <a href="payment-slip.html">Payment Slip</a>
    </aside>

    <main>
        <h2>Insert Employee</h2>
        <form class="customer-form">
            <div class="form-group">
                <label for="employee_id">Employee ID:</label>
                <input type="text" id="employee_id" required>
            </div>
            <div class="form-group">
                <label for="employee_name">Employee Name:</label>
                <input type="text" id="employee_name" required>
            </div>
            <div class="form-group">
                <label for="employee_phone">Phone:</label>
                <input type="tel" id="employee_phone" required>
            </div>
            <div class="form-group">
                <label for="employee_email">Email:</label>
                <input type="email" id="employee_email">
            </div>
            <div class="form-group">
                <label for="designation">Designation:</label>
                <input type="text" id="designation" required>
            </div>
            <button type="button" class="save-button">Save</button>
        </form>
    </main>
</div>
