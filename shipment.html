
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Shipment - DHL Courier Service</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>DHL Courier Service</h1>
    <p>Courier Service Management System</p>
</header>

<div class="container">
    <aside class="sidebar">
        <h2>Menu</h2>
        <a href="index.html">Home</a>
        <a href="insert.html">Insert</a>
        <a href="view.html">View</a>
        <a href="search.html">Search</a>
        <a href="payment-slip.html">Payment Slip</a>
    </aside>

    <main>
        <h2>Insert Shipment</h2>
        <form class="customer-form">
            <div class="form-group">
                <label for="shipment_id">Shipment ID:</label>
                <input type="text" id="shipment_id" required>
            </div>
            <div class="form-group">
                <label for="tracking_number">Tracking Number:</label>
                <input type="text" id="tracking_number" required>
            </div>
            <div class="form-group">
                <label for="sender_id">Sender Customer ID:</label>
                <input type="text" id="sender_id" required>
            </div>
            <div class="form-group">
                <label for="receiver_id">Receiver Customer ID:</label>
                <input type="text" id="receiver_id" required>
            </div>
            <div class="form-group">
                <label for="origin">Origin:</label>
                <input type="text" id="origin" required>
            </div>
            <div class="form-group">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" required>
            </div>
            <div class="form-group">
                <label for="shipment_date">Shipment Date:</label>
                <input type="date" id="shipment_date" required>
            </div>
            <div class="form-group">
                <label for="shipping_fee">Shipping Fee (Tk.):</label>
                <input type="number" id="shipping_fee" min="0" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="shipment_status">Shipment Status:</label>
                <select id="shipment_status" required>
                    <option value="">Select Status</option>
                    <option>Booked</option>
                    <option>In Transit</option>
                    <option>Out for Delivery</option>
                    <option>Delivered</option>
                    <option>Cancelled</option>
                </select>
            </div>
            <div class="form-group">
                <label for="shipment_employee">Employee ID:</label>
                <input type="text" id="shipment_employee" required>
            </div>
            <button type="button" class="save-button">Save</button>
        </form>
    </main>
</div>

<footer>
    <p>Developed by: Faiza Anjum Ritu</p>
    <p>ID: 25203175 | Section: B</p>
    <p>Department of CSE | IUBAT</p>
</footer>
</body>
</html>
